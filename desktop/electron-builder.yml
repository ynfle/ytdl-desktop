appId: com.ytdl.desktop
productName: YTDL Desktop
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - build/icon.png
  - build/icon.ico
  - package.json
asarUnpack:
  - out/preload/**
  - build/**
npmRebuild: false
# Use the Electron already installed by the electron package.
# A Windows package build otherwise downloads the zip again and fetches
# SHASUMS256.txt from GitHub. That response is sometimes an HTML error page,
# and the build stops with "Could not parse checksum file".
electronDist: node_modules/electron/dist
win:
  icon: build/icon.ico
  executableName: YTDL Desktop
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # Same-folder upgrades overwrite files in place (installer/win/installer.nsh)
  # so shortcuts and taskbar pins are not removed by an uninstall.
  include: installer/win/installer.nsh
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.png
  category: public.app-category.video
  target:
    - target: pkg
      arch:
        - arm64
        - x64
    - target: dmg
      arch:
        - arm64
        - x64
pkg:
  # Relative to directories.buildResources (desktop/build).
  scripts: ../installer/mac/pkg-scripts
  # Payload lands here, not on the live app. postinstall copies it into the
  # existing .app so the Dock pin's bundle folder is never deleted.
  installLocation: /Library/YTDL Desktop/staged
  allowAnywhere: false
  allowCurrentUserHome: true
  allowRootDirectory: true
  overwriteAction: upgrade
  isVersionChecked: false
  isRelocatable: false
  # The app has to be quit before its files can be replaced.
  mustClose:
    - com.ytdl.desktop
  artifactName: ${productName}-Installer-${version}-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
